<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0e7de" />
    <meta
      name="description"
      content="Kambili & Co — fashion, interiors, and celebrations with a soft, intentional point of view."
    />
    <title>Kambili &amp; Co — Fashion, Interiors, Experiences</title>
    <script>
      // Bookmarks into the original home page still open the corresponding house section.
      if (location.hash && location.hash !== '#entry') {
        location.replace('house.html' + location.search + location.hash);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" href="./splash-rose-mobile.jpg" media="(max-width: 820px)" fetchpriority="high" />
    <link rel="preload" as="image" href="./splash-rose-bg.jpg" media="(min-width: 821px)" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css?v=3.5" />
    <link rel="stylesheet" href="entry.css" />
    <noscript>
      <style>
        .splash { display: none; }
        body.is-loading .entry { visibility: visible; }
        body.is-loading { overflow: auto; }
      </style>
    </noscript>
  </head>
  <body class="is-loading">
    <div class="splash" data-splash aria-hidden="false" role="status" aria-label="Loading Kambili and Co" style="background: #f0e7de !important;">
      <div class="splash-bg" aria-hidden="true">
        <picture>
          <source media="(max-width: 820px)" srcset="./splash-rose-mobile.jpg" />
          <img src="./splash-rose-bg.jpg" alt="" width="1920" height="1080" decoding="async" fetchpriority="high" />
        </picture>
      </div>
      <div class="splash-content" style="color: #582828 !important;">
        <p class="splash-eyebrow" style="color: #6b3a3a !important; text-shadow: none !important;">Est. with intention</p>
        <p class="splash-wordmark" aria-label="Kambili and Co" style="color: #582828 !important; text-shadow: none !important;">
          <span class="splash-line" data-splash-line style="color: #582828 !important; text-shadow: none !important;">
            <i style="--i:0; color: #582828 !important; text-shadow: none !important;">K</i><i style="--i:1; color: #582828 !important; text-shadow: none !important;">a</i><i style="--i:2; color: #582828 !important; text-shadow: none !important;">m</i><i style="--i:3; color: #582828 !important; text-shadow: none !important;">b</i><i style="--i:4; color: #582828 !important; text-shadow: none !important;">i</i><i style="--i:5; color: #582828 !important; text-shadow: none !important;">l</i><i style="--i:6; color: #582828 !important; text-shadow: none !important;">i</i>
          </span>
          <span class="splash-amp" data-splash-amp style="color: #6b3a3a !important; text-shadow: none !important;">&amp;</span>
          <span class="splash-line splash-co" data-splash-line style="color: #582828 !important; text-shadow: none !important;">
            <i style="--i:8; color: #582828 !important; text-shadow: none !important;">C</i><i style="--i:9; color: #582828 !important; text-shadow: none !important;">o</i>
          </span>
        </p>
        <span class="splash-rule" aria-hidden="true" style="background: #6b3a3a !important;"></span>
      </div>
    </div>

    <main class="entry" id="entry">
      <h1 class="sr-only">Enter Kambili &amp; Co</h1>
      <nav class="entry-doors" aria-label="Explore Kambili and Co">
        <a class="entry-side entry-interiors" href="studio-kambili.html">
          <span class="entry-caption">
            <span class="entry-discipline">Interiors</span>
            <span class="entry-name">Studio <span>Kambili</span></span>
          </span>
        </a>
        <a class="entry-house" href="house.html" aria-label="Open the Kambili &amp; Co website"></a>
        <a class="entry-side entry-fashion" href="styled-by-kambili.html">
          <span class="entry-caption">
            <span class="entry-discipline">Fashion</span>
            <span class="entry-name">Styled by <span>Kambili</span></span>
          </span>
        </a>
      </nav>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
